name: campus-database
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a verified PostgreSQL 18 image digest}
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 768m
    shm_size: 128m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_wal_size=512MB
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      - log_min_error_statement=panic
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - /srv/databases/campus-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
