<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>三星堆校区地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eee6db;--ground:#f5f0e8;--campus:#fffaf3;--grid:rgba(110,81,58,.055);
  --ink:#44372d;--ink2:#887561;--road:#fffdf9;--roadEdge:#dfd0be;--water:#a9c8c2;--green:#d8dfc5;--plaza:#ede3d5;
  --panel:rgba(255,252,247,.96);--line:rgba(110,81,58,.13);--me:var(--app-accent,#b84020);--shadow:0 8px 24px rgba(85,60,40,.10);
  --c-teach:var(--app-accent,#b84020);--c-dorm:#71886a;--c-food:#b98338;--c-office:#a17b84;--c-sport:#bd7070;--c-life:#978573;
  --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211c18;--ground:#2b241e;--campus:#352c24;--grid:rgba(221,191,154,.07);
  --ink:#f5eade;--ink2:#c0a991;--road:#493c30;--roadEdge:#65513e;--water:#496b65;--green:#455440;--plaza:#40342a;
  --panel:rgba(48,39,32,.96);--line:rgba(221,191,154,.16);--me:#e79b73;--shadow:0 10px 30px rgba(0,0,0,.30);
  --c-teach:#e79b73;--c-dorm:#a9bd91;--c-food:#dfb267;--c-office:#c59daa;--c-sport:#df9999;--c-life:#c3ad95;}}
:root[data-theme="dark"]{
  --bg:#211c18;--ground:#2b241e;--campus:#352c24;--grid:rgba(221,191,154,.07);
  --ink:#f5eade;--ink2:#c0a991;--road:#493c30;--roadEdge:#65513e;--water:#496b65;--green:#455440;--plaza:#40342a;
  --panel:rgba(48,39,32,.96);--line:rgba(221,191,154,.16);--me:#e79b73;--shadow:0 10px 30px rgba(0,0,0,.30);
  --c-teach:#e79b73;--c-dorm:#a9bd91;--c-food:#dfb267;--c-office:#c59daa;--c-sport:#df9999;--c-life:#c3ad95;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}

/* map paint */
.ground{fill:var(--ground)}
.gridfill{fill:url(#grid)}
.campus{fill:var(--campus);stroke:var(--roadEdge);stroke-width:1.2;vector-effect:non-scaling-stroke}
.phase2{fill:url(#hatch);stroke:var(--ink2);stroke-dasharray:6 5;stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.7}
.green{fill:var(--green)}
.plaza{fill:var(--plaza);stroke:var(--roadEdge);stroke-width:1;vector-effect:non-scaling-stroke}
.water{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.waterfill{fill:var(--water)}
.roadE{fill:none;stroke:var(--roadEdge);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.rlbl{fill:var(--ink2);font-weight:600;font-size:calc(var(--fs) * 10.5px);letter-spacing:.05em;paint-order:stroke;stroke:var(--road);stroke-width:calc(var(--fs) * 3px);stroke-linejoin:round}
.big .rlbl{font-size:calc(var(--fs) * 12px)}
.b{fill:color-mix(in srgb,var(--k) 18%,var(--campus));stroke:var(--k);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.b.plain{--k:var(--ink2);fill:color-mix(in srgb,var(--ink2) 10%,var(--campus));cursor:default}
.b.sel{fill:color-mix(in srgb,var(--k) 55%,var(--campus));stroke-width:2.6}
.b.plaza{fill:var(--plaza);stroke:var(--roadEdge)}
.b.plaza.sel{fill:color-mix(in srgb,var(--k) 30%,var(--plaza));stroke:var(--k)}
.b.track{fill:color-mix(in srgb,var(--c-sport) 70%,var(--campus))}
.b.dim,.pin.dim{opacity:.22}
.lbl.dim{opacity:.25}
.track{fill:var(--c-sport);opacity:.75}
.field{fill:var(--green);stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.lbl{fill:var(--ink);font-size:calc(var(--fs) * 12px);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--campus);stroke-width:calc(var(--fs) * 3.2px);stroke-linejoin:round}
.lbl.major{font-size:calc(var(--fs) * 14px);font-weight:800}
.lbl.zone{font-family:var(--display);font-size:calc(var(--fs) * 26px);fill:var(--ink2);font-weight:400;opacity:.55;stroke:none}
.lbl.hide{display:none}
.pin{cursor:pointer}
.pin circle{fill:var(--panel);stroke:var(--k);stroke-width:2}
.pin text{font-size:13px;text-anchor:middle;dominant-baseline:central}
.route{fill:none;stroke:var(--me);stroke-width:3;stroke-dasharray:8 7;vector-effect:non-scaling-stroke;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-15}}
.acc{fill:var(--me);fill-opacity:.12;stroke:var(--me);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.medot{fill:var(--me);stroke:#fff;stroke-width:3}
.mehalo{fill:var(--me);opacity:.35;transform-origin:0 0;animation:halo 2s ease-out infinite}
.manual .medot{fill:var(--ink2)}
.manual .mehalo{fill:var(--ink2)}
@keyframes halo{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.6);opacity:0}}
.selring{fill:none;stroke:var(--k);stroke-width:2;vector-effect:non-scaling-stroke;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.2}}

/* chrome */
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5;max-width:560px}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.brand{font-family:var(--display);font-size:22px;line-height:1;white-space:nowrap;color:var(--ink);letter-spacing:.02em}
.brand small{display:block;font-family:var(--ui);font-size:10.5px;color:var(--ink2);margin-top:3px;letter-spacing:0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;border:0;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:12px;padding:10px 12px 10px 34px;font:inherit;font-size:15px;color:var(--ink);outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--c-teach)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55}
.results{pointer-events:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:52vh;overflow-y:auto}
.results.on{display:block}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover,.res:focus-visible{background:color-mix(in srgb,var(--ink) 6%,transparent);outline:none}
.res i{width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.res b{font-weight:700}
.res span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.category-strip{position:relative;pointer-events:auto;min-width:0}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 36px 2px 2px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;user-select:none;cursor:grab;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.dragging{cursor:grabbing;scroll-behavior:auto}
.chips-next{position:absolute;right:0;top:2px;width:30px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--campus);color:var(--ink2);box-shadow:-5px 0 12px var(--campus);cursor:pointer}
.chips-next[hidden]{display:none}
.chips-next svg{width:15px;height:15px}
.chip{flex:none;display:flex;align-items:center;gap:5px;min-height:34px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:6px 7px;font-size:12px;white-space:nowrap;user-select:none;touch-action:manipulation;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--campus);border-color:var(--ink)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--campus)}

.ctrls{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
.cbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.cbtn:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--c-teach);outline-offset:2px}
.cbtn.loc{width:52px;height:52px;border-radius:50%;background:var(--me);color:#fff;border-color:transparent}
.cbtn.loc.live svg{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.group{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.group .cbtn{border-radius:0;box-shadow:none}
.group .cbtn+.cbtn{border-top:0}
@media(max-height:560px){
  .ctrls{top:auto;bottom:28px;transform:none;display:grid;grid-template-columns:repeat(3,44px);gap:6px}
  .ctrls .group{display:contents}
  .ctrls .cbtn.loc{width:44px;height:44px;border-radius:14px}
  .ctrls .group .cbtn{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
}

.scale{position:absolute;left:14px;bottom:16px;z-index:3;font-size:11px;color:var(--ink2);pointer-events:none}
.scale div{height:6px;border:2px solid var(--ink2);border-top:0;margin-top:3px}
.status{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:3;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap;display:none;cursor:pointer}
.status.on{display:block}

/* panel */
.panel{position:absolute;z-index:6;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s;overflow-y:auto}
@media (max-width:719px){
  .panel{left:0;right:0;bottom:0;border-radius:22px 22px 0 0;max-height:58%;transform:translateY(105%);padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .panel.on{transform:none}
  .panel::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
}
@media (min-width:720px){
  .panel{left:12px;top:132px;width:360px;max-height:calc(100% - 150px);border-radius:20px;padding:18px;transform:translateX(-110%);opacity:0}
  .panel.on{transform:none;opacity:1}
  .top{right:auto;width:560px}
}
.p-head{display:flex;align-items:flex-start;gap:12px}
.p-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);cursor:pointer;display:grid;place-items:center}
.p-sub{color:var(--ink2);margin:8px 0 0;font-size:14px;line-height:1.6}
.p-desc{margin:12px 0 0;font-size:14.5px;line-height:1.75}
.units{margin:14px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.units li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;font-size:14px}
.units li+li{border-top:1px solid var(--line)}
.units em{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.dist{display:flex;gap:14px;margin-top:14px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--me) 12%,transparent)}
.dist b{font-size:20px;font-variant-numeric:tabular-nums}
.dist span{display:block;font-size:12px;color:var(--ink2)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:12px;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer}
.map-navigation-hint{margin:8px 4px 0;font-size:11px;line-height:1.5;color:var(--ink2);pointer-events:none}.walking-navigation{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.walking-navigation label{font-size:13px;font-weight:600}.walking-go{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--app-accent,var(--me))!important;color:#fff!important;border-color:transparent!important}.walking-go:disabled{opacity:.6;cursor:wait}.navigation-error{font-size:12px;line-height:1.7;color:#b84020}.btn.pri{background:var(--ink);color:var(--campus);border-color:var(--ink)}
.note{font-size:12px;color:var(--ink2);margin-top:12px;line-height:1.6}

/* modal */
.modal{position:absolute;inset:0;z-index:9;background:rgba(5,12,30,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;border:1px solid var(--line)}
@media (min-width:720px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:28px}
.sheet p{font-size:14px;line-height:1.7;color:var(--ink2);margin:8px 0}
.steps{margin:12px 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14px;line-height:1.6;margin:8px 0}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--me);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
select{width:100%;font:inherit;font-size:15px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--campus);color:var(--ink);margin:6px 0 10px}
.map-select-native{display:none}
.map-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;margin:8px 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--campus);text-align:left;font-size:14px;cursor:pointer}
.map-select-trigger span{min-width:0;line-height:1.5;overflow-wrap:anywhere}
.map-select-trigger svg{width:16px;height:16px;flex-shrink:0;color:var(--ink2)}
.place-picker{position:absolute;inset:0;z-index:16;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(55,39,27,.32)}
.place-picker[hidden]{display:none}
.place-picker-sheet{display:flex;flex-direction:column;width:100%;max-width:440px;max-height:calc(100% - 24px);padding:18px 16px 12px;border:1px solid var(--line);border-radius:20px;background:var(--campus);box-shadow:var(--shadow);overflow:hidden}
.place-picker-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-shrink:0}
.place-picker-heading h3{font-size:17px;margin:0;font-weight:650}
.place-picker-search{width:100%;min-height:44px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--campus);color:var(--ink);font:inherit;font-size:16px;outline:none;flex-shrink:0}
.place-picker-search:focus{border-color:var(--me);box-shadow:0 0 0 2px color-mix(in srgb,var(--me) 12%,transparent)}
.place-picker-count{margin:12px 2px 7px;font-size:11px;color:var(--ink2);flex-shrink:0}
.place-picker-list{min-height:0;overflow-y:auto;overscroll-behavior:contain;max-height: min(52vh,420px);scrollbar-width:thin;scrollbar-color:var(--roadEdge) transparent;touch-action:pan-y}
.place-picker-option{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;margin:3px 0;padding:11px 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;line-height:1.5;cursor:pointer}
.place-picker-option>span{flex:1;min-width:0;overflow-wrap:anywhere}
.place-picker-option>svg{width:17px;height:17px;color:var(--ink2);flex-shrink:0}
.place-picker-option[aria-selected="true"]{background:color-mix(in srgb,var(--me) 10%,var(--campus));color:var(--me);font-weight:600}
.place-picker-option[aria-selected="true"]>svg{color:var(--me)}
.place-picker-option:focus-visible{outline:2px solid var(--me);outline-offset:-2px}
.place-picker-empty{padding:28px 12px;text-align:center;font-size:13px;line-height:1.7;color:var(--ink2)}
.calstat{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,transparent);margin:10px 0}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 130px);transform:translate(-50%,-10px);background:var(--ink);color:var(--campus);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:.25s;max-width:min(88vw,420px);text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <svg id="map" aria-label="三星堆校区交互地图">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1.2"/></pattern>
      <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="var(--ground)"/><line x1="0" y1="0" x2="0" y2="14" stroke="var(--grid)" stroke-width="5"/></pattern>
    </defs>
    <g id="world"></g>
  </svg>

  <div class="top">
    <div class="bar">
      <div class="brand">三星堆校区<small>校园导览地图</small></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜楼栋、学院、办事处…" autocomplete="off" aria-label="搜索地点">
      </div>
    </div>
    <div class="results" id="results" role="listbox"></div>
    <div class="category-strip"><div class="chips" id="chips"></div><button type="button" class="chips-next" id="chipsNext" aria-label="向右查看更多分类"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <p class="map-navigation-hint">点地图上的楼栋，或搜索地点 → 去这里</p>
  </div>

  <div class="ctrls">
    <button class="cbtn loc" id="locBtn" aria-label="定位我的位置" title="定位我的位置">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <div class="group">
      <button class="cbtn" id="zin" aria-label="放大"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="cbtn" id="zout" aria-label="缩小"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button>
    </div>

const svg=$("#map");

let S=1,TX=0,TY=0,fitS=1,raf=0;

function clampS(s){return Math.max(fitS*0.55,Math.min(fitS*14,s))}
function apply(){

}
function lod(){
  const fs=1/S;

  P.forEach(p=>{
    if(p.pinG){p.pinG.setAttribute("transform",`translate(${p.c[0]} ${p.c[1]}) scale(${fs})`);return}
    if(!p.lbl)return;

function fitAll(anim){
  const w=vw(),h=vh();

  const s=fitS, cx=BOX.x+BOX.w/2, cy=BOX.y+BOX.h/2+20;
  go(cx,cy,s,anim);
}
function go(wx,wy,s,anim,offY,offX){
  s=clampS(s);
  const w=vw(),h=vh();
  const sy=h/2+(offY||0),sx=w/2+(offX||0);
  const nTX=sx-wx*s,nTY=sy-wy*s;
  if(!anim||matchMedia("(prefers-reduced-motion:reduce)").matches){S=s;TX=nTX;TY=nTY;apply();return}
  const s0=S,x0=TX,y0=TY,t0=performance.now(),D=480;
  // interpolate around the world point for a smooth fly

    let k=Math.min(1,(t-t0)/D);k=1-Math.pow(1-k,3);
    const ss=s0*Math.pow(s/s0,k),cx=c0x+(wx-c0x)*k,cy=c0y+(wy-c0y)*k;

const ptrs=new Map();let base=null,tap=null,lastTap=null,moved=false;

function rebase(){
  const a=[...ptrs.values()];
  if(a.length===1)base={mode:1,x:a[0].x,y:a[0].y,TX,TY};
  else if(a.length>=2){
    const [p,q]=a;base={mode:2,d:Math.hypot(p.x-q.x,p.y-q.y)||1,mx:(p.x+q.x)/2,my:(p.y+q.y)/2,S,TX,TY};

  else tap=null;

svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;

  if(!base)return;
  if(base.mode===1){
    const dx=p.x-base.x,dy=p.y-base.y;
    if(Math.hypot(dx,dy)>7)moved=true;
    if(moved){TX=base.TX+dx;TY=base.TY+dy;apply()}
  }else{
    moved=true;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=clampS(base.S*d/base.d);

});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;

    svg.classList.remove("dragging");
    if(tap&&!moved&&Date.now()-tap.t<450){
      const now=Date.now();
      if(lastTap&&now-lastTap.t<300&&Math.hypot(lastTap.x-tap.x,lastTap.y-tap.y)<30){zoomAt(2,tap.x,tap.y,true);lastTap=null}

}

/* ---------- category chips ---------- */
const chips=$("#chips");let filter=null;
chips.innerHTML=`<button class="chip" data-c="" aria-pressed="true">全部</button>`+Object.entries(CATS).map(([k,c])=>`<button class="chip" data-c="${k}" aria-pressed="false" style="--k:${c.v}"><i></i>${c.n}</button>`).join("");
const chipsNext=$("#chipsNext");let chipDrag=null,chipDragged=false;
function updateChipScroll(){chipsNext.hidden=chips.scrollWidth-chips.clientWidth-chips.scrollLeft<=1}
chips.addEventListener("scroll",updateChipScroll,{passive:true});new ResizeObserver(updateChipScroll).observe(chips);
chipsNext.onclick=()=>chips.scrollBy({left:Math.max(120,chips.clientWidth*.7),behavior:"smooth"});
chips.addEventListener("pointerdown",event=>{chipDragged=false;if(event.pointerType!=="mouse"||event.button!==0)return;chipDrag={id:event.pointerId,x:event.clientX,left:chips.scrollLeft}});
chips.addEventListener("pointermove",event=>{if(!chipDrag||event.pointerId!==chipDrag.id)return;const delta=event.clientX-chipDrag.x;if(!chipDragged&&Math.abs(delta)<5)return;chipDragged=true;chips.classList.add("dragging");if(!chips.hasPointerCapture(event.pointerId))chips.setPointerCapture(event.pointerId);chips.scrollLeft=chipDrag.left-delta;event.preventDefault()});
const finishChipDrag=()=>{chipDrag=null;chips.classList.remove("dragging")};
chips.addEventListener("pointerup",finishChipDrag);chips.addEventListener("pointercancel",finishChipDrag);chips.addEventListener("lostpointercapture",finishChipDrag);
chips.addEventListener("click",event=>{if(chipDragged&&event.detail!==0){event.preventDefault();event.stopImmediatePropagation();chipDragged=false}},true);
chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  filter=b.dataset.c||null;
  chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  P.forEach(p=>{const dim=!!filter&&p.cat!==filter;if(p.shape)p.shape.classList.toggle("dim",dim);if(p.lbl)p.lbl.classList.toggle("dim",dim)});
  const left=b.offsetLeft,right=left+b.offsetWidth;
  if(left<chips.scrollLeft)chips.scrollTo({left:Math.max(0,left-4),behavior:"smooth"});
  else if(right>chips.scrollLeft+chips.clientWidth-36)chips.scrollTo({left:right-chips.clientWidth+36,behavior:"smooth"});
});

/* ---------- storage ---------- */
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function save(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- location ---------- */
const DEFAULT_M_PER_UNIT=0.7; // 由 400 米跑道尺寸估算
let calPts=load("sxd-cal")||[],cal=solve(calPts),manual=load("sxd-manual"),manualMode=false;
let watchId=null,lastFix=null,meXY=null,following=false;
function solve(pts){
  if(!pts||pts.length<2)return null;
  const lat0=pts[0].lat,lng0=pts[0].lng,k=Math.cos(lat0*Math.PI/180);
  const src=pts.map(p=>[(p.lng-lng0)*111320*k,-(p.lat-lat0)*110574]),dst=pts.map(p=>[p.x,p.y]);
  const n=pts.length,mean=a=>[a.reduce((s,p)=>s+p[0],0)/n,a.reduce((s,p)=>s+p[1],0)/n];
  const ps=mean(src),qs=mean(dst);
  let re=0,im=0,den=0;
  for(let i=0;i<n;i++){
    const px=src[i][0]-ps[0],py=src[i][1]-ps[1],qx=dst[i][0]-qs[0],qy=dst[i][1]-qs[1];
    re+=qx*px+qy*py;im+=qy*px-qx*py;den+=px*px+py*py;
  }
  if(den/n<15*15)return null; // 点太近
  const ar=re/den,ai=im/den;
  return{lat0,lng0,k,ar,ai,bx:qs[0]-(ar*ps[0]-ai*ps[1]),by:qs[1]-(ai*ps[0]+ar*ps[1]),upm:Math.hypot(ar,ai)};
}
function geo2xy(lat,lng){
  const px=(lng-cal.lng0)*111320*cal.k,py=-(lat-cal.lat0)*110574;
  return[cal.ar*px-cal.ai*py+cal.bx,cal.ai*px+cal.ar*py+cal.by];
}
function mPerUnit(){return cal?1/cal.upm:DEFAULT_M_PER_UNIT}
function distM(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])*mPerUnit()}
function fmtM(m){return m>=1000?(m/1000).toFixed(2)+" 公里":Math.round(m)+" 米"}

function setMe(x,y,accM,isManual){
  meXY=[x,y];meG.style.display="";
  meG.classList.toggle("manual",!!isManual);
  acc.style.display=accM?"":"none";
  if(accM)acc.setAttribute("r",accM/mPerUnit());
  acc.setAttribute("cx",x);acc.setAttribute("cy",y);
  lod();drawRoute();
  if(selId)renderPanel(byId[selId]);
}
function startGPS(){
  if(!("geolocation" in navigator)){toast("这个浏览器不支持定位，可以用「手动标出我」。");return false}
  if(watchId!=null)return true;
  setStatus("正在获取 GPS…");
  watchId=navigator.geolocation.watchPosition(onFix,onErr,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  $("#locBtn").classList.add("live");
  return true;
}
function onFix(pos){
  lastFix={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,t:Date.now()};
  $("#gpsAcc").textContent=`GPS 精度约 ${Math.round(lastFix.acc)} 米`;
  if(cal){
    const [x,y]=geo2xy(lastFix.lat,lastFix.lng);
    setMe(x,y,lastFix.acc,false);
    const inside=x>BOX.x-300&&x<BOX.x+BOX.w+300&&y>BOX.y-300&&y<BOX.y+BOX.h+300;
    setStatus(inside?`实时定位中，精度约 ${Math.round(lastFix.acc)} 米`:"你目前不在校园范围内");
    if(following){following=false;go(x,y,Math.max(S,fitS*2.6),true)}
  }else{
    setStatus(`已获取 GPS（±${Math.round(lastFix.acc)} 米），还差校准，点这里`);
  }
}
function onErr(err){
  $("#locBtn").classList.remove("live");
  navigator.geolocation.clearWatch(watchId);watchId=null;
  const m={1:"定位权限被拒绝。请在浏览器或系统设置里允许此页面使用位置；如果页面嵌在其他应用里被拦截，可以用「手动标出我」。",2:"暂时拿不到位置信号，到室外空旷处再试。",3:"获取位置超时，请稍后再试。"};
  toast(m[err.code]||"定位失败。");setStatus("");
}
function getFix(){
  return new Promise((res,rej)=>{
    if(lastFix&&Date.now()-lastFix.t<8000)return res(lastFix);
    if(!("geolocation" in navigator))return rej({code:0});
    navigator.geolocation.getCurrentPosition(pos=>{onFix(pos);res(lastFix)},e=>{onErr(e);rej(e)},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
async function recordAt(p){
  startGPS();
  toast("正在读取你的 GPS 位置…");
  try{
    const f=await getFix();
    calPts=calPts.filter(c=>c.id!==p.id);
    calPts.push({id:p.id,x:p.c[0],y:p.c[1],lat:f.lat,lng:f.lng});
    save("sxd-cal",calPts);
    cal=solve(calPts);
    updCal();
    if(cal){
      const ok=cal.upm>0.4&&cal.upm<5;
      toast(ok?`校准完成，已用 ${calPts.length} 个点。现在会实时显示你的位置。`:"校准结果和地图比例相差很大，可能某个点记错了，建议清空后重新校准。");
      manual=null;save("sxd-manual",null);onFix({coords:{latitude:f.lat,longitude:f.lng,accuracy:f.acc}});
    }else if(calPts.length>=2){
      toast("两个校准点离得太近了，请换一个更远的地标再记一次。");
    }else{
      toast(`已记下「${p.name}」（GPS ±${Math.round(f.acc)} 米）。再去另一个地标记一次就完成了。`);
    }
  }catch(e){}
}
function updCal(){
  $("#calCount").textContent=cal?`已校准（${calPts.length} 个点）`:`已记录 ${calPts.length} 个点，还需 ${Math.max(0,2-calPts.length)||1} 个`;
  updateScale();
}

/* ---------- status / toast / scale ---------- */
const statusEl=$("#status");
function setStatus(t){statusEl.textContent=t;statusEl.classList.toggle("on",!!t)}
statusEl.onclick=()=>{if(!cal)openCal();else if(meXY)go(meXY[0],meXY[1],Math.max(S,fitS*2.6),true)};
let tt=0;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3600)}
function updateScale(){
  const upx=1/S, mpp=upx*mPerUnit(); // 米/像素
  const target=mpp*90,nice=[5,10,20,25,50,100,200,250,500,1000,2000];
  const m=nice.find(n=>n>=target)||2000;
  $("#scaleBar").style.width=(m/mpp)+"px";$("#scaleTxt").textContent=(m>=1000?m/1000+" 公里":m+" 米")+(cal?"":" ≈");
}

/* ---------- calibration modal ---------- */
const modal=$("#modal"),calSel=$("#calSel");
calSel.innerHTML=["gate","mz","tsg","wh","zxl","qx","tyg","th","tz","zy","fy1","hq","xy"].map(id=>`<option value="${id}">${byId[id].name}</option>`).join("");
enhanceMapSelect(calSel,"选择校准地标");
function openCal(){modal.classList.add("on");updCal();startGPS()}
$("#calBtn").onclick=openCal;
$("#calClose").onclick=()=>modal.classList.remove("on");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("on")});
$("#calRec").onclick=()=>recordAt(byId[calSel.value]);
$("#calClear").onclick=()=>{calPts=[];cal=null;save("sxd-cal",null);updCal();meXY=null;meG.style.display="none";route.style.display="none";setStatus("");toast("已清空校准点。")};
$("#manualBtn").onclick=()=>{modal.classList.remove("on");manualMode=true;toast("在地图上点一下你所在的位置。")};

/* ---------- controls ---------- */
$("#locBtn").onclick=()=>{
  if(cal){following=true;startGPS();if(meXY&&lastFix)go(meXY[0],meXY[1],Math.max(S,fitS*2.6),true);return}
  if(manual&&meXY){go(meXY[0],meXY[1],Math.max(S,fitS*2.6),true);return}
  openCal();
};
$("#zin").onclick=()=>zoomAt(1.6,vw()/2,vh()/2,true);
$("#zout").onclick=()=>zoomAt(1/1.6,vw()/2,vh()/2,true);
$("#fit").onclick=()=>fitAll(true);
$("#theme").onclick=()=>{
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.dataset.theme=cur==="dark"?"light":"dark";save("sxd-theme",r.dataset.theme);
};
document.addEventListener("keydown",e=>{
  if(document.activeElement===q)return;
  if(e.key==="+"||e.key==="=")zoomAt(1.4,vw()/2,vh()/2,true);
  if(e.key==="-")zoomAt(1/1.4,vw()/2,vh()/2,true);
  if(e.key==="Escape"){closePanel();modal.classList.remove("on")}
});
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{const z=S/fitS,cx=(vw()/2-TX)/S,cy=(vh()/2-TY)/S;fitS=Math.min(vw()/BOX.w,(vh()-80)/BOX.h);go(cx,cy,fitS*z,false)},120)});

/* ---------- boot ---------- */
const th=load("sxd-theme");if(th)document.documentElement.dataset.theme=th;
initialView();
updCal();
if(manual)setMe(manual[0],manual[1],0,true);
if(cal){startGPS()}
})();
</script>
