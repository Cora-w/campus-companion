<svg xmlns="http://www.w3.org/2000/svg" viewBox="380 300 1620 1400"><style>:root{
  --bg:#DFE6F0;--ground:#EEF2F8;--campus:#FAFBFD;--grid:rgba(29,58,138,.075);
  --ink:#13235A;--ink2:#56648A;--road:#FFFFFF;--roadEdge:#C6D0E2;--water:#A3CCF2;--green:#D3E9D0;--plaza:#E8ECF4;
  --panel:rgba(255,255,255,.94);--line:rgba(19,35,90,.12);--me:#FF7A00;--shadow:0 10px 30px rgba(19,35,90,.16);
  --c-teach:#2F5BEA;--c-dorm:#0C9A83;--c-food:#E08600;--c-office:#8A4FE8;--c-sport:#DE444C;--c-life:#5F6B85;
  --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
svg{--fs:3}/* map paint */
.ground{fill:var(--ground)}
.gridfill{fill:url(#grid)}
.campus{fill:var(--campus);stroke:var(--roadEdge);stroke-width:1.2;vector-effect:non-scaling-stroke}
.phase2{fill:url(#hatch);stroke:var(--ink2);stroke-dasharray:6 5;stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.7}
.green{fill:var(--green)}
.plaza{fill:var(--plaza);stroke:var(--roadEdge);stroke-width:1;vector-effect:non-scaling-stroke}
.water{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.waterfill{fill:var(--water)}
.roadE{fill:none;stroke:var(--roadEdge);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.rlbl{fill:var(--ink2);font-weight:600;font-size:calc(var(--fs) * 10.5px);letter-spacing:.05em;paint-order:stroke;stroke:var(--road);stroke-width:calc(var(--fs) * 3px);stroke-linejoin:round}
.big .rlbl{font-size:calc(var(--fs) * 12px)}
.b{fill:color-mix(in srgb,var(--k) 18%,var(--campus));stroke:var(--k);stroke-width:1.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.b.plain{--k:var(--ink2);fill:color-mix(in srgb,var(--ink2) 10%,var(--campus));cursor:default}
.b.sel{fill:color-mix(in srgb,var(--k) 55%,var(--campus));stroke-width:2.6}
.b.plaza{fill:var(--plaza);stroke:var(--roadEdge)}
.b.plaza.sel{fill:color-mix(in srgb,var(--k) 30%,var(--plaza));stroke:var(--k)}
.b.track{fill:color-mix(in srgb,var(--c-sport) 70%,var(--campus))}
.b.dim,.pin.dim{opacity:.22}
.lbl.dim{opacity:.25}
.track{fill:var(--c-sport);opacity:.75}
.field{fill:var(--green);stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.lbl{fill:var(--ink);font-size:calc(var(--fs) * 12px);font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--campus);stroke-width:calc(var(--fs) * 3.2px);stroke-linejoin:round}
.lbl.major{font-size:calc(var(--fs) * 14px);font-weight:800}
.lbl.zone{font-family:var(--display);font-size:calc(var(--fs) * 26px);fill:var(--ink2);font-weight:400;opacity:.55;stroke:none}
.lbl.hide{display:none}
.pin{cursor:pointer}
.pin circle{fill:var(--panel);stroke:var(--k);stroke-width:2}
.pin text{font-size:13px;text-anchor:middle;dominant-baseline:central}
.route{fill:none;stroke:var(--me);stroke-width:3;stroke-dasharray:8 7;vector-effect:non-scaling-stroke;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-15}}
.acc{fill:var(--me);fill-opacity:.12;stroke:var(--me);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.medot{fill:var(--me);stroke:#fff;stroke-width:3}
.mehalo{fill:var(--me);opacity:.35;transform-origin:0 0;animation:halo 2s ease-out infinite}
.manual .medot{fill:var(--ink2)}
.manual .mehalo{fill:var(--ink2)}
@keyframes halo{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.6);opacity:0}}
.selring{fill:none;stroke:var(--k);stroke-width:2;vector-effect:non-scaling-stroke;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.2}}

